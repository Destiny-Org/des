# Test suite for Destiny's dub, built and run with the Destiny compiler.
# Linux x86_64 only: that is the only platform destiny64 is packaged for.

name: Testsuite

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'changelog/**'
  push:
    branches:
      - main

env:
  DFLAGS: -revert=safedefault

jobs:
  single_checks:
    name: "Single sanity check"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Destiny
        uses: ./.github/actions/setup-destiny
      - name: Run tests
        run: |
          # check for trailing whitespace
          if find . -type f -name '*.d' -exec grep -Hn "[[:blank:]]$" {} \; | grep .; then
              echo "The files above have trailing whitespace"
              exit 1
          fi
          # check that the man page generation still works
          des --compiler=destiny --single -v scripts/man/gen_man.d

  main:
    name: Run
    runs-on: ubuntu-24.04
    steps:
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev netcat-openbsd

    - uses: actions/checkout@v4

    - name: Install Destiny
      uses: ./.github/actions/setup-destiny
      with:
        build-dub: 'false'

    - name: Build
      run: GITVER=v1.40.0-destiny destiny -revert=safedefault -run build.d -revert=safedefault -O

    - name: Test
      env:
        DC: destiny
        DUB: ${{ github.workspace }}/bin/des
      run: |
        export PATH="$PWD/bin:$PATH"
        des run --compiler=destiny --single test/issue2051_running_unittests_from_dub_single_file_packages_fails.d
        ./scripts/ci/ci.sh
