# When a release is published, build dub with Destiny and attach it.
# Linux x86_64 only: that is the only platform destiny64 is packaged for.
name: Build release assets

on:
  release:
    types:
      - published

jobs:
  build:
    name: 'Build dub ${{ github.event.release.tag_name }}'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Destiny
        uses: ./.github/actions/setup-destiny
        with:
          build-dub: 'false'

      - name: Build release
        env:
          GITVER: ${{ github.event.release.tag_name }}
          DMD: destiny
        run: |
          destiny -revert=safedefault -run ./build.d -revert=safedefault -O -release
          cd bin
          tar -c -f "des-${GITVER}-linux-x86_64.tar.gz" -v -z --owner=0 --group=0 des

      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "bin/des-${TAG}-linux-x86_64.tar.gz"
